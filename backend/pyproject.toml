[project]
name = "financial-copilot-backend"
version = "0.1.0"
description = "Financial Copilot Django API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<6",
    "django-ninja>=1.3",
    "dj-database-url",
    "psycopg[binary]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
